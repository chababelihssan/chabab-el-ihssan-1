name: Deploy to DZSecurity (cPanel FTP)

# يعمل عند كل تعديل على الفرع main (بما فيه حفظ التعديلات من لوحة /admin) ويدويًا من تبويب Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dzsecurity
  cancel-in-progress: false   # لا نقطع رفعًا جاريًا (حتى لا يبقى الموقع نصف مرفوع)؛ يُنتظر ثم يُنشر آخر تعديل

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - run: npm ci

      - name: Security audit (يفشل فقط عند ثغرات خطيرة)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          # اختياري: متغير SITE_URL في GitHub (Settings > Secrets and variables > Actions > Variables)
          # إن تُرك فارغًا يُستعمل site_url من src/content/settings.json
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload dist to DZSecurity via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
        server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
